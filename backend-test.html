<!DOCTYPE html>
<html>
<head>
    <title>Backend Test</title>
</head>
<body>
    <h1>Student Hub Backend Test</h1>
    
    <button onclick="testHealth()">Test Health Endpoint</button>
    <button onclick="testRegister()">Test Registration</button>
    
    <div id="results" style="margin-top: 20px; padding: 10px; background: #f0f0f0;"></div>

    <script>
        const API_URL = 'https://student-hub-1-jp67.onrender.com/api';
        
        async function testHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                document.getElementById('results').innerHTML = 
                    `<h3>Health Check:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('results').innerHTML = 
                    `<h3>Health Check Error:</h3><pre>${error.message}</pre>`;
            }
        }
        
        async function testRegister() {
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'testuser' + Date.now(),
                        email: 'test' + Date.now() + '@example.com',
                        password: 'testpassword123'
                    })
                });
                
                const data = await response.json();
                document.getElementById('results').innerHTML = 
                    `<h3>Registration Test (Status: ${response.status}):</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('results').innerHTML = 
                    `<h3>Registration Error:</h3><pre>${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
